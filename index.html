<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оракул Наталья: Баланс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0f19 0%, #1b1b2f 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        .balance-val {
            font-size: 48px;
            color: #7b68ee;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(123, 104, 238, 0.5);
        }
        button {
            background: #7b68ee;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
        .footer { margin-top: 20px; font-size: 12px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ Ваш баланс ✨</h2>
        <div class="balance-val" id="balance">...</div>
        <p>Раскладов доступно</p>
        <button onclick="sendBuy()">Купить 10 раскладов (50 ⭐)</button>
        <div class="footer">Бесплатные попытки обновляются каждое утро</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Считываем баланс из URL (передадим его при открытии)
        const urlParams = new URLSearchParams(window.location.search);
        const userBalance = urlParams.get('bal') || '0';
        document.getElementById('balance').innerText = userBalance;

        function sendBuy() {
            // Отправляем данные боту
            tg.sendData("action:buy_10");
            tg.close();
        }
    </script>
</body>
</html>
