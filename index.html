<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оракул Наталья</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f0f19; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .balance-val { font-size: 32px; color: #7b68ee; font-weight: bold; }
        .btn { background: #7b68ee; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; margin: 5px 0; cursor: pointer; }
        .btn-buy { background: transparent; border: 1px solid #7b68ee; color: #7b68ee; margin-top: 10px; }
        .hint { font-size: 12px; opacity: 0.6; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="balance-val" id="balance">...</div>
        <p>доступно раскладов</p>
    </div>

    <div class="card">
        <h3>🔮 Совершить таинство</h3>
        <button class="btn" onclick="sendAction('draw_1')">🃏 Карта дня (1 шт.)</button>
        <button class="btn" onclick="sendAction('draw_3')">🔮 Расклад на 3 карты</button>
    </div>

    <div class="card">
        <h3>💎 Магазин энергии</h3>
        <button class="btn btn-buy" onclick="sendAction('buy_10')">Купить 10 раскладов (50 ⭐)</button>
    </div>

    <p class="hint">Нажмите на кнопку, и Наталья пришлет ответ в чат</p>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Считываем баланс из URL
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('balance').innerText = urlParams.get('bal') || '0';

        function sendAction(action) {
            // Отправляем данные боту
            tg.sendData(action);
            // Закрываем мини-апп, чтобы пользователь увидел результат в чате
            tg.close();
        }
    </script>
</body>
</html>
